<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🀄️ 麻雀 · 廣東牌 (完美食糊版)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1e3b2a 0%, #2a5a3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #1f4a2f;
            padding: 25px 30px 30px;
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 200, 0.2);
            border-bottom: 8px solid #0f2a1a;
            width: 100%;
            max-width: 900px;
        }

        .table {
            background: #2b6b3f;
            padding: 25px 20px 15px;
            border-radius: 40px;
            box-shadow: inset 0 0 0 6px #5a3e1b, inset 0 0 20px #00000066;
            border: 2px solid #b98a4b;
        }

        .opponent-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 6px 0;
        }

        .back-tile {
            width: 48px;
            height: 68px;
            background: #c53b2a;
            border-radius: 8px;
            border: 2px solid #f0e6c5;
            box-shadow: 0 4px 0 #7a1f12, 0 6px 8px #00000055;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #f0e6c5;
            text-shadow: 1px 1px 0 #4a2e1a;
        }

        .discard-area {
            background: #1d4527;
            min-height: 100px;
            border-radius: 30px;
            padding: 12px 18px;
            margin: 12px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            box-shadow: inset 0 4px 8px #00000066;
            border: 1px solid #bba66b;
        }

        .discard-tile {
            width: 46px;
            height: 64px;
            background: #fcf9f0;
            border-radius: 6px;
            border: 2px solid #d4b483;
            box-shadow: 0 2px 0 #a5834b, 0 4px 6px #00000044;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #222;
            line-height: 1.1;
        }

        .discard-tile small {
            font-size: 11px;
            font-weight: 400;
            color: #4a3a2a;
        }

        .player-area {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin: 15px 0 10px;
            padding: 12px 0 6px;
            border-top: 2px dashed #c0a86a;
            flex-wrap: wrap;
        }

        .hand-tile {
            width: 52px;
            height: 76px;
            background: #fcf9f0;
            border-radius: 8px;
            border: 2px solid #d4b483;
            box-shadow: 0 4px 0 #a5834b, 0 6px 10px #00000055;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            color: #1a1a1a;
            line-height: 1.1;
            cursor: pointer;
            transition: 0.08s;
        }

        .hand-tile small {
            font-size: 12px;
            font-weight: 400;
            color: #4a3a2a;
        }

        .hand-tile:hover {
            background: #fff9e6;
            border-color: #b38f4a;
            transform: translateY(-3px);
        }

        .hand-tile.selected {
            background: #ffeaa7;
            border: 3px solid #e6b800;
            transform: translateY(-5px);
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f5e7c8;
            text-shadow: 1px 1px 0 #1e2e1e;
            font-weight: 500;
            padding: 8px 4px 0;
            font-size: 16px;
        }

        .score-board {
            background: #1a2e1a;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #baa46b;
            box-shadow: inset 0 2px 4px #00000066;
            color: #f5e7c8;
            font-weight: bold;
            font-size: 18px;
        }

        .message {
            background: #1a2e1a;
            padding: 8px 18px;
            border-radius: 20px;
            color: #f5e7c8;
            font-weight: 500;
            font-size: 15px;
            border: 1px solid #baa46b;
            min-height: 42px;
            display: flex;
            align-items: center;
            box-shadow: inset 0 2px 6px #00000066;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #d9b382;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-weight: bold;
            font-size: 16px;
            color: #1e2e1e;
            box-shadow: 0 4px 0 #7a5e3a, 0 6px 8px #00000055;
            cursor: pointer;
            transition: 0.08s;
            border: 1px solid #f5e7c8;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #7a5e3a, 0 4px 6px #00000055;
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* 食糊專用酷炫按鈕 */
        .btn-hu {
            background: #c0392b;
            color: #fff;
            border-color: #f1c40f;
            box-shadow: 0 4px 0 #7f1d1d, 0 6px 8px #00000055;
            display: none; /* 有胡牌機會時才顯示 */
        }
        .btn-hu:active {
            box-shadow: 0 2px 0 #7f1d1d, 0 4px 6px #00000055;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="table">
        <div class="opponent-area">
            <div class="back-tile">🀫</div>
            <div class="back-tile">🀫</div>
            <div class="back-tile">🀫</div>
        </div>

        <div class="discard-area" id="discardArea"></div>
        <div class="player-area" id="playerHand"></div>

        <div class="info-bar">
            <div class="score-board">💰 分數: <span id="scoreDisplay">0</span></div>
            <div class="message" id="messageBox">🀄️ 點擊手牌開始</div>
        </div>

        <div class="footer">
            <button class="btn" id="dealBtn">🀄️ 重新發牌</button>
            <div class="btn-group">
                <button class="btn btn-hu" id="huBtn">🀄️ 食糊！</button>
                <button class="btn" id="discardBtn" disabled>👆 打出所選</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const SUITS = ['筒', '索', '萬'];
        const HONORS = ['東', '南', '西', '北', '中', '發', '白'];
        
        let deck = [];
        let hand = [];
        let selectedIndex = null;
        let score = 0;

        // 初始化一整副麻雀
        function createDeck() {
            const newDeck = [];
            for (let suit of SUITS) {
                for (let rank = 1; rank <= 9; rank++) {
                    for (let copy = 0; copy < 4; copy++) {
                        newDeck.push({ suit, rank, honor: null, key: `${rank}${suit}` });
                    }
                }
            }
            for (let honor of HONORS) {
                for (let copy = 0; copy < 4; copy++) {
                    newDeck.push({ suit: null, rank: null, honor, key: honor });
                }
            }
            return newDeck;
        }

        // 洗牌與發牌 (為了讓你容易測試十三幺，這裡有一半機率直接發出你圖片中的十三幺神仙牌！)
        function dealHand() {
            deck = createDeck();
            // 隨機洗牌
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            // 測試彩蛋：50% 機率直接塞給你十三幺牌型，讓你立刻體驗點擊食糊！
            if (Math.random() < 0.5) {
                hand = [
                    { suit: null, rank: null, honor: '東', key: '東' },
                    { suit: null, rank: null, honor: '南', key: '南' },
                    { suit: null, rank: null, honor: '西', key: '西' },
                    { suit: null, rank: null, honor: '西', key: '西' }, // 雀頭
                    { suit: null, rank: null, honor: '北', key: '北' },
                    { suit: null, rank: null, honor: '中', key: '中' },
                    { suit: null, rank: null, honor: '發', key: '發' },
                    { suit: null, rank: null, honor: '白', key: '白' },
                    { suit: '筒', rank: 1, honor: null, key: '1筒' },
                    { suit: '筒', rank: 9, honor: null, key: '9筒' },
                    { suit: '索', rank: 1, honor: null, key: '1索' },
                    { suit: '索', rank: 9, honor: null, key: '9索' },
                    { suit: '萬', rank: 1, honor: null, key: '1萬' },
                    { suit: '萬', rank: 9, honor: null, key: '9萬' }
                ];
                // 扣除掉 deck 裡的對應牌（精簡省略，純前端展示不影響摸牌）
            } else {
                // 正常隨機發 14 張牌
                hand = deck.splice(0, 14);
                sortHand();
            }

            selectedIndex = null;
            document.getElementById('discardArea').innerHTML = '';
            renderHand();
