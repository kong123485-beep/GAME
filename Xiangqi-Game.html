:root {
  --bg: #f6efe2;
  --surface: #fffaf0;
  --surface-2: #fff5f5;
  --ink: #2b211a;
  --muted: rgba(43, 33, 26, 0.68);
  --line: rgba(74, 46, 24, 0.22);
  --red: #b91c1c;
  --red-soft: rgba(185, 28, 28, 0.12);
  --wood: #e9d7b6;
  --board: #f7ebd0;
  --gold: #d9a441;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #211a13;
    --surface: #2e251c;
    --surface-2: #342722;
    --ink: #f6efe2;
    --muted: rgba(246, 239, 226, 0.68);
    --line: rgba(246, 239, 226, 0.22);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.16);
    --wood: #3b2d1d;
    --board: #4b3a24;
    --gold: #e4b65a;
  }
}

html, body, #root {
  min-height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Serif TC", "IBM Plex Sans", serif;
}

* {
  box-sizing: border-box;
}

button {
  font-family: inherit;
}

.board-wood {
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.72) 0%, transparent 42%),
    linear-gradient(90deg, #f5e7c7 0%, #e8d1a2 18%, #e9d7b6 35%, #ddc08a 55%, #e7d0a0 80%, #f2e3c0 100%);
  box-shadow: inset 0 0 0 1px rgba(60,30,10,.15), inset 0 0 30px rgba(80,40,15,.12), 0 20px 60px rgba(60,30,10,.18);
}

.piece-red {
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #fff5f5 18%, #ffd4d4 55%, #ffb3b3 100%);
  border-color: #b91c1c;
  color: #b91c1c;
  box-shadow: 0 1.5px 0 #7f1d1d, 0 4px 10px rgba(185,28,28,.22), inset 0 1px 0 rgba(255,255,255,.9);
}

.piece-black {
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f5f5f0 18%, #e8e0d0 55%, #d6cbb6 100%);
  border-color: #1f2937;
  color: #111827;
  box-shadow: 0 1.5px 0 #111827, 0 4px 10px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.9);
}

.piece-shell {
  width: clamp(26px, 8.9%, 46px);
  aspect-ratio: 1 / 1;
  transform: translate(-50%, -50%);
}

.piece-inner {
  font-size: clamp(12px, 56%, 19px);
  line-height: 1;
}

@media (max-width: 390px) {
  .piece-shell {
    width: clamp(25px, 8.6%, 38px);
  }

  .piece-inner {
    font-size: clamp(11px, 52%, 16px);
  }
}

.no-scrollbar::-webkit-scrollbar {
  width: 5px;
}

.no-scrollbar::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,.18);
  border-radius: 99px;
}

.hover\:bg-black:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(0 0 0 / var(--tw-bg-opacity, 1));
}

.hover\:bg-black\/5:hover{
  background-color: rgb(0 0 0 / 0.05);
}

.hover\:opacity-100:hover{
  opacity: 1;
}

.active\:scale-\[0\.96\]:active{
  --tw-scale-x: 0.96;
  --tw-scale-y: 0.96;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.disabled\:opacity-40:disabled{
  opacity: 0.4;
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:h-\[11\%\]{
    height: 11%;
  }

  .sm\:max-h-\[320px\]{
    max-height: 320px;
  }

  .sm\:p-\[20px\]{
    padding: 20px;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-5{
    padding-top: 1.25rem;
  }

  .sm\:text-\[22px\]{
    font-size: 22px;
  }
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-\[1\.15fr_0\.85fr\]{
    grid-template-columns: 1.15fr 0.85fr;
  }

  .lg\:gap-6{
    gap: 1.5rem;
  }
}
