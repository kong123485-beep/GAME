<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🀄 麻雀·棋類遊戲導航</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',sans-serif;background:linear-gradient(145deg,#1e3c2c 0%,#2a5a3a 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;color:#f0f7e6;}
        .card{background:#fcf9f2;background-image:radial-gradient(circle at 20% 30%,rgba(220,200,150,0.15) 0%,transparent 30%),repeating-linear-gradient(45deg,rgba(180,150,100,0.05) 0px,rgba(180,150,100,0.05) 2px,transparent 2px,transparent 8px);border-radius:3rem 3rem 2rem 2rem;padding:2.8rem 2rem 3rem;max-width:900px;width:100%;box-shadow:0 25px 40px -12px rgba(0,0,0,0.7),inset 0 1px 4px rgba(255,245,240,0.8);border:2px solid #e3d6b5;position:relative;}
        .card::before{content:"";position:absolute;top:12px;left:12px;right:12px;bottom:12px;border-radius:2.2rem 2.2rem 1.5rem 1.5rem;border:1px solid rgba(210,180,120,0.5);pointer-events:none;}
        .title-section{text-align:center;margin-bottom:2.2rem;position:relative;}
        .title-section h1{font-size:2.6rem;font-weight:700;letter-spacing:4px;color:#2b4a2e;text-shadow:2px 2px 0 #d9c89e,4px 4px 0 rgba(0,0,0,0.1);display:inline-block;background:rgba(255,245,220,0.5);padding:0.25rem 1.8rem;border-radius:60px;border-bottom:4px solid #b59b6b;}
        .subhead{margin-top:1rem;font-size:1.15rem;color:#4f6b4a;font-style:italic;background:#e9e0ccb3;display:inline-block;padding:0.3rem 1.8rem;border-radius:40px;font-weight:500;}
        .links-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:2rem 1.6rem;margin:1.2rem 0 0.8rem;}
        .link-tile{flex:0 1 230px;min-width:200px;background:#fffffffa;border-radius:32px;padding:0.6rem 0.6rem 1.1rem;box-shadow:0 12px 0 #7a5a3a,0 18px 25px -8px rgba(0,0,0,0.5);border:2px solid #cbb282;transition:all 0.15s ease;text-align:center;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-decoration:none;color:#2c3e2b;}
        .link-tile:hover{transform:translateY(-8px);box-shadow:0 16px 0 #5e3f28,0 22px 30px -8px rgba(0,0,0,0.6);border-color:#b89b6b;background:#fffcf0;}
        .link-tile:active{transform:translateY(4px);box-shadow:0 6px 0 #5e3f28,0 12px 20px -8px rgba(0,0,0,0.5);}
        .tile-icon{font-size:3.6rem;line-height:1;margin:0.2rem 0 0.4rem;filter:drop-shadow(2px 4px 6px rgba(0,0,0,0.3));display:flex;align-items:center;justify-content:center;height:80px;}
        .tile-icon img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(2px 4px 6px rgba(0,0,0,0.3));}
        .tile-name{font-size:1.65rem;font-weight:800;letter-spacing:1px;color:#2f4b2c;background:#d9d0b0;padding:0.35rem 1.2rem;border-radius:40px;margin:0.4rem 0 0.5rem;border:1px solid #b8a374;box-shadow:inset 0 1px 4px #fff8e0,0 3px 0 #8a7a5a;word-break:break-all;}
        .tile-desc{font-size:1rem;color:#5f5a48;background:#f2ead6;padding:0.4rem 1rem;border-radius:30px;display:inline-block;margin-top:0.25rem;font-weight:500;border:1px solid #d6c7a8;}
        .deco-bird{position:absolute;top:-18px;right:30px;font-size:2.5rem;filter:drop-shadow(0 6px 6px rgba(0,0,0,0.4));transform:rotate(5deg);animation:float 3s infinite alternate;}
        @keyframes float{0%{transform:rotate(5deg) translateY(0);}100%{transform:rotate(-5deg) translateY(-5px);}}
        .corner-tile{position:absolute;font-size:2rem;opacity:0.3;bottom:10px;left:20px;transform:rotate(-10deg);color:#7f9a6b;}
        .corner-tile-right{position:absolute;font-size:2rem;opacity:0.3;bottom:10px;right:25px;transform:rotate(15deg) scaleX(-1);color:#7f9a6b;}
        @media (max-width:600px){.card{padding:1.8rem 1.2rem 2rem;border-radius:2rem}.title-section h1{font-size:1.9rem;letter-spacing:2px}.link-tile{min-width:150px;flex:0 1 46%;}.tile-name{font-size:1.3rem}.tile-icon{font-size:2.8rem;height:70px}.tile-icon img{width:65px;height:65px;}}
    </style>
</head>
